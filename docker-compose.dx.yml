services:
  app:
    image: ${IMAGE}
    pull_policy: "missing"
    init: true
    volumes:
      - type: bind
        source: "./"
        target: "/root/work"
        consistency: "consistent"
      - type: bind
        source: ${PWD}/dx/state/.pi/
        target: /root/.pi
        consistency: "consistent"
    entrypoint: /root/show-help-in-app-container-then-wait.sh
    working_dir: /root/work
    ports:
      - "4000:4000"
      - "127.0.0.1:4001:8192"

